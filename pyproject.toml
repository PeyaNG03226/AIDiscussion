[project]
name = "aidiscussion"
version = "0.1.0"
description = "和一群 AI 成员一起群聊、私聊的桌面聊天工作台"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["llm", "multi-agent", "chat", "fastapi", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "colorama>=0.4.6",
    "fastapi>=0.163.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
aidiscussion = "aidiscussion.__main__:main"

[project.gui-scripts]
# Windows 上会生成无控制台的 aidiscussion-desktop.exe，供桌面快捷方式使用
aidiscussion-desktop = "aidiscussion.desktop.launcher:main"

[project.optional-dependencies]
# 桌面壳是可选能力：`uv sync --extra desktop` 后才启用 --desktop
desktop = ["pywebview>=5.0"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.2",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidiscussion"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入就是通过参数默认值声明的，这是框架惯例
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
